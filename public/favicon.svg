<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1f1a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- House Roof -->
  <path d="M 130 240 L 256 130 L 382 240"
        stroke="url(#emeraldTeal)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- House Body -->
  <path d="M 160 220 V 370 C 160 378 167 385 175 385 H 337 C 345 385 352 378 352 370 V 220"
        fill="#0f172a"
        stroke="url(#emeraldTeal)"
        stroke-width="20"
        stroke-linejoin="round" />

  <!-- Door -->
  <rect x="230" y="300" width="52" height="85" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="8" />

  <!-- Window -->
  <rect x="190" y="250" width="36" height="36" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="6" />
  <rect x="286" y="250" width="36" height="36" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="6" />

  <!-- Maintenance Wrench Check Accent -->
  <path d="M 210 262 L 245 292 L 310 220"
        stroke="#f8fafc"
        stroke-width="0"
        opacity="0" />
</svg>
